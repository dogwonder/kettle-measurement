[package]
name = "kettle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "kettle"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
runner = { path = "../runner" }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[features]
pdf = ["runner/pdf"]
# The eval could always *find* a photograph fixture and never read one:
# `document.rs` gates the image path on `feature = "vision"`, the app
# turns it on by default, and the CLI had no way to. #399's acceptance
# item 8 — a scored photo run — was unmeetable for want of this line.
vision = ["runner/vision"]

[dev-dependencies]
rust_decimal = { workspace = true }
