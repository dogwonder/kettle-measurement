[package]
name = "kettle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "kettle"
path = "src/main.rs"

[dependencies]
runner = { path = "../runner" }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[features]
pdf = ["runner/pdf"]

[dev-dependencies]
rust_decimal = { workspace = true }
