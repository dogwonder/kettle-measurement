[package]
name = "runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rust_decimal = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
num_cpus = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
strsim = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
jsonschema = { workspace = true }
ureq = { workspace = true }
pdfium-render = { workspace = true, optional = true }
html5ever = { workspace = true }
cssparser = { workspace = true }

# Vision exists only on Apple platforms, so the dependency is scoped to
# the target rather than to the feature alone. CI lints and tests with
# `--all-features` on Linux, where enabling `vision` must therefore
# still build — it does, because the feature turns on no dependency
# here and every call site is `cfg(all(target_os = "macos", …))`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-vision = { workspace = true, optional = true }

[features]
pdf = ["dep:pdfium-render"]
vision = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-vision"]
