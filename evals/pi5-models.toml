# Where the floor is: the smallest model that can still do a pack's job.
#
# Rewritten 1 September 2026 (#595). The original asked this question of
# the subscription-audit pack against Qwen2.5, and both halves have since
# moved: that pack is withdrawn (#545, no model has cleared its normalise
# bar since scoring 14) and it no longer declares the `min_tier` this
# file's comment used to quote. A file describing a field that does not
# exist, on a pack nobody is offered, is worse than no file.
#
# The question it was asking is not stale, and is now the live one. The
# letter pack's work is *attention*, not knowledge: find the date, copy
# the words, decide whether a passage asks something. Every failure
# measured on 1 September was judgement, never reading — the 4B scored
# 84/84 on dates. Knowledge is what needs scale (#257's merchants,
# where 4B/9B/27B genuinely differ); attention may not. So a pack with
# a narrow band of asks might run well below the shipped tier, and
# "local models with a good harness" stops being a preference and
# becomes a measured claim.
#
# Measure the letter pack, because it is the offerable one and the one a
# real letter is read by. Fill in whatever you downloaded: only
# `qwen3.5-4b-q4_k_m.gguf` is pinned in `app/src-tauri/models.json`, so
# the smaller entries below are deliberately not named as though they
# were sanctioned — any instruct-tuned GGUF of that size is a fair test.
# What is under test is grammar-following at temperature 0 under an
# enum-constrained JSON Schema, not world knowledge.
#
#   cargo run --release -p kettle -- eval app.kttl.letter-to-actions \
#     --models evals/pi5-models.toml --runs 3
#
# Read `confident-wrong` and the harm ceilings, never the pooled verdict
# alone. And note what a small model cannot be excused: a ceiling is a
# ceiling whatever the parameter count, and a floor found by lowering
# the bar is not a floor.
#
# The Raspberry Pi 5 keeps its place in the filename because it is the
# honest floor hardware — no discrete GPU, the machine a person might
# actually leave running — and because a published path is a stability
# commitment (#478). The file is not limited to it: the same set run on
# any box answers the same question about size.

[[model]]
file = "models/qwen3.5-4b-q4_k_m.gguf"
params = "4B"
quant = "Q4_K_M"

[[model]]
file = "models/qwen3.5-1.7b-instruct-q4_k_m.gguf"
params = "1.7B"
quant = "Q4_K_M"
